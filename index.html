<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>小朋友中文闪卡 ⭐</title>
<style>
  :root {
    --bg1: #FF9A9E;
    --bg2: #FECFEF;
    --card-bg: #ffffff;
    --accent: #FF6B6B;
    --text: #2d3436;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "KaiTi", "STKaiti", "KaiTi_GB2312", "Kaiti SC", "楷体", "楷体_GB2312", serif;
    background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    color: var(--text);
  }
  .header {
    text-align: center;
    margin-bottom: 16px;
  }
  .header h1 {
    font-size: 1.8rem;
    color: #e84393;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .progress {
    font-size: 1.1rem;
    margin-top: 6px;
    color: #636e72;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .card-container {
    perspective: 1000px;
    width: 100%;
    max-width: 420px;
    height: 320px;
    margin: 20px 0;
  }
  .card {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 15px 35px rgba(0,0,0,0.15);
    padding: 20px;
  }
  .front {
    background: white;
  }
  .back {
    background: linear-gradient(145deg, #ffeaa7, #fdcb6e);
    transform: rotateY(180deg);
  }
  .chinese {
    font-size: 5.5rem;
    font-weight: bold;
    line-height: 1.1;
    text-align: center;
    font-family: "KaiTi", "STKaiti", "KaiTi_GB2312", "Kaiti SC", "楷体", "楷体_GB2312", serif;
  }
  .pinyin {
    font-size: 2.2rem;
    margin-top: 20px;
    color: #2d3436;
    font-weight: 500;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
  }
  .hint {
    position: absolute;
    bottom: 16px;
    font-size: 0.95rem;
    color: #888;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
  }
  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 10px;
    width: 100%;
    max-width: 420px;
  }
  button {
    background: #ff6b6b;
    color: white;
    border: none;
    border-radius: 50px;
    padding: 16px 28px;
    font-size: 1.15rem;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 6px 15px rgba(255,107,107,0.3);
    transition: all 0.2s;
    min-width: 110px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
  }
  button:active { transform: scale(0.96); }
  button.secondary { background: #74b9ff; box-shadow: 0 6px 15px rgba(116,185,255,0.3); }
  button.success { background: #55efc4; color: #2d3436; box-shadow: 0 6px 15px rgba(85,239,196,0.3); }
  .speak-btn {
    background: #a29bfe;
    margin-top: 12px;
    font-size: 1.3rem;
    padding: 14px 40px;
  }
  .category-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 10px;
    max-width: 420px;
  }
  .cat-btn {
    padding: 8px 14px;
    font-size: 0.9rem;
    min-width: auto;
    background: rgba(255,255,255,0.7);
    color: #2d3436;
    box-shadow: none;
  }
  .cat-btn.active {
    background: #e84393;
    color: white;
  }
  @media (max-width: 400px) {
    .chinese { font-size: 4.2rem; }
    .pinyin { font-size: 1.8rem; }
    .card-container { height: 280px; }
  }
</style>
</head>
<body>
  <div class="header">
    <h1>🌟 小朋友中文闪卡 🌟</h1>
    <div class="progress" id="progress">1 / 40</div>
  </div>

  <div class="category-bar" id="categoryBar">
    <button class="cat-btn active" data-cat="all">全部</button>
    <button class="cat-btn" data-cat="family">家人</button>
    <button class="cat-btn" data-cat="body">身體</button>
    <button class="cat-btn" data-cat="food">食物</button>
    <button class="cat-btn" data-cat="daily">日常</button>
    <button class="cat-btn" data-cat="home">家裡</button>
    <button class="cat-btn" data-cat="other">其他</button>
  </div>

  <div class="card-container">
    <div class="card" id="card">
      <div class="card-face front">
        <div class="chinese" id="chineseText">黃瓜</div>
        <div class="hint">點我看拼音 👆</div>
      </div>
      <div class="card-face back">
        <div class="pinyin" id="pinyinText">huáng guā</div>
        <div class="hint">再點一次返回</div>
      </div>
    </div>
  </div>

  <button class="speak-btn" id="speakBtn">🔊 聽發音</button>

  <div class="controls">
    <button id="prevBtn">← 上一張</button>
    <button class="secondary" id="shuffleBtn">🔀 打亂</button>
    <button id="nextBtn">下一張 →</button>
  </div>

<script>
const allCards = [
  // 食物
  { char: "黃瓜", pinyin: "huáng guā", cat: "food" },
  { char: "白菜", pinyin: "bái cài", cat: "food" },
  { char: "香蕉", pinyin: "xiāng jiāo", cat: "food" },
  { char: "橙", pinyin: "chéng", cat: "food" },
  { char: "魚", pinyin: "yú", cat: "food" },
  { char: "雞蛋", pinyin: "jī dàn", cat: "food" },
  { char: "米", pinyin: "mǐ", cat: "food" },
  { char: "肉", pinyin: "ròu", cat: "food" },
  { char: "牛奶", pinyin: "niú nǎi", cat: "food" },
  { char: "月餅", pinyin: "yuè bǐng", cat: "food" },
  { char: "水", pinyin: "shuǐ", cat: "food" },

  // 家人
  { char: "爸爸", pinyin: "bà ba", cat: "family" },
  { char: "媽媽", pinyin: "mā ma", cat: "family" },
  { char: "哥哥", pinyin: "gē ge", cat: "family" },
  { char: "姐姐", pinyin: "jiě jie", cat: "family" },
  { char: "弟弟", pinyin: "dì di", cat: "family" },
  { char: "妹妹", pinyin: "mèi mei", cat: "family" },

  // 身體
  { char: "眼睛", pinyin: "yǎn jing", cat: "body" },
  { char: "嘴巴", pinyin: "zuǐ ba", cat: "body" },
  { char: "鼻子", pinyin: "bí zi", cat: "body" },
  { char: "耳朵", pinyin: "ěr duo", cat: "body" },
  { char: "手", pinyin: "shǒu", cat: "body" },
  { char: "腳", pinyin: "jiǎo", cat: "body" },
  { char: "一雙手", pinyin: "yì shuāng shǒu", cat: "body" },
  { char: "一雙腳", pinyin: "yì shuāng jiǎo", cat: "body" },
  { char: "一雙眼睛", pinyin: "yì shuāng yǎn jing", cat: "body" },
  { char: "一雙耳朵", pinyin: "yì shuāng ěr duo", cat: "body" },
  { char: "一張嘴巴", pinyin: "yì zhāng zuǐ ba", cat: "body" },
  { char: "一個鼻子", pinyin: "yí gè bí zi", cat: "body" },

  // 日常
  { char: "洗手", pinyin: "xǐ shǒu", cat: "daily" },
  { char: "洗臉", pinyin: "xǐ liǎn", cat: "daily" },
  { char: "洗澡", pinyin: "xǐ zǎo", cat: "daily" },
  { char: "吃早餐", pinyin: "chī zǎo cān", cat: "daily" },
  { char: "喝牛奶", pinyin: "hē niú nǎi", cat: "daily" },
  { char: "回家", pinyin: "huí jiā", cat: "daily" },
  { char: "坐下", pinyin: "zuò xià", cat: "daily" },
  { char: "笑", pinyin: "xiào", cat: "daily" },

  // 家裡
  { char: "床", pinyin: "chuáng", cat: "home" },
  { char: "門", pinyin: "mén", cat: "home" },
  { char: "房子", pinyin: "fáng zi", cat: "home" },
  { char: "衣櫃", pinyin: "yī guì", cat: "home" },
  { char: "書架", pinyin: "shū jià", cat: "home" },
  { char: "皮球", pinyin: "pí qiú", cat: "home" },
  { char: "玩具", pinyin: "wán jù", cat: "home" },

  // 其他
  { char: "月亮", pinyin: "yuè liang", cat: "other" },
  { char: "燈籠", pinyin: "dēng long", cat: "other" },
  { char: "生日", pinyin: "shēng rì", cat: "other" },
  { char: "老師", pinyin: "lǎo shī", cat: "other" },
  { char: "老師好", pinyin: "lǎo shī hǎo", cat: "other" },
  { char: "校長", pinyin: "xiào zhǎng", cat: "other" },
  { char: "早", pinyin: "zǎo", cat: "other" },
  { char: "我", pinyin: "wǒ", cat: "other" },
  { char: "人", pinyin: "rén", cat: "other" },
  { char: "男孩子", pinyin: "nán hái zi", cat: "other" },
  { char: "女孩子", pinyin: "nǚ hái zi", cat: "other" },
  { char: "中秋節", pinyin: "zhōng qiū jié", cat: "other" },
  { char: "紙和筆", pinyin: "zhǐ hé bǐ", cat: "other" },
];

let cards = [...allCards];
let currentIndex = 0;
let isFlipped = false;

const cardEl = document.getElementById('card');
const chineseText = document.getElementById('chineseText');
const pinyinText = document.getElementById('pinyinText');
const progressEl = document.getElementById('progress');
const speakBtn = document.getElementById('speakBtn');

function updateCard() {
  const card = cards[currentIndex];
  chineseText.textContent = card.char;
  pinyinText.textContent = card.pinyin;
  progressEl.textContent = `${currentIndex + 1} / ${cards.length}`;
  if (isFlipped) {
    cardEl.classList.remove('flipped');
    isFlipped = false;
  }
}

function speak() {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(cards[currentIndex].char);
  utter.lang = 'zh-TW';
  utter.rate = 0.8;
  utter.pitch = 1.1;
  window.speechSynthesis.speak(utter);
}

cardEl.addEventListener('click', () => {
  cardEl.classList.toggle('flipped');
  isFlipped = !isFlipped;
  if (isFlipped) speak();
});

document.getElementById('nextBtn').addEventListener('click', () => {
  currentIndex = (currentIndex + 1) % cards.length;
  updateCard();
});

document.getElementById('prevBtn').addEventListener('click', () => {
  currentIndex = (currentIndex - 1 + cards.length) % cards.length;
  updateCard();
});

document.getElementById('shuffleBtn').addEventListener('click', () => {
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  currentIndex = 0;
  updateCard();
});

speakBtn.addEventListener('click', speak);

// Category filter
document.querySelectorAll('.cat-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const cat = btn.dataset.cat;
    cards = cat === 'all' ? [...allCards] : allCards.filter(c => c.cat === cat);
    currentIndex = 0;
    updateCard();
  });
});

// Keyboard support
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') {
    e.preventDefault();
    document.getElementById('nextBtn').click();
  } else if (e.key === 'ArrowLeft') {
    document.getElementById('prevBtn').click();
  } else if (e.key === 'Enter' || e.key === 'f') {
    cardEl.click();
  }
});

// Init
updateCard();
</script>
</body>
</html>
